<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BR Mobile v1.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bb6ad;font-family:system-ui;color:white}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}.panel{background:#071b22c9;border:1px solid #ffffff55;border-radius:10px;padding:8px 11px}#top{position:absolute;top:10px;left:10px;font-size:12px}#stats{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}#help{position:absolute;right:10px;top:10px;font-size:11px;text-align:right}button{pointer-events:auto;color:white;background:#102c35dd;border:1px solid #ffffff99;border-radius:12px;padding:12px;font-weight:700}#camera{position:absolute;right:12px;bottom:102px}#fire{position:absolute;right:20px;bottom:22px;width:78px;height:78px;border-radius:50%;background:#a83d32}#stick{pointer-events:auto;position:absolute;left:22px;bottom:25px;width:116px;height:116px;border:2px solid #ffffff99;border-radius:50%;background:#0b263655;touch-action:none}#nub{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:#ffffffbb}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:27px}#message{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:13px;white-space:nowrap}#reload{position:absolute;right:110px;bottom:35px}
</style></head><body><canvas id="game"></canvas><div id="hud">
<div id="top" class="panel"><b>BR MOBILE · v1.0</b><br>Campo de treinamento<br><span id="status">Preparando…</span></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
const skyTex=canvasTex(1024,512,(g,w,h)=>{const q=g.createLinearGradient(0,0,0,h);q.addColorStop(0,'#286b9a');q.addColorStop(.5,'#83c6d2');q.addColorStop(1,'#e6d8b0');g.fillStyle=q;g.fillRect(0,0,w,h);for(let i=0;i<45;i++){g.globalAlpha=.13;g.fillStyle='#fff';g.beginPath();g.ellipse((i*173)%w,40+(i*71)%230,55+(i%5)*12,12+(i%3)*5,0,0,Math.PI*2);g.fill()}g.globalAlpha=1});skyTex.mapping=THREE.EquirectangularReflectionMapping;
const scene=new THREE.Scene();scene.background=skyTex;scene.fog=new THREE.Fog(0x9bc7d0,75,190);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#game'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;sun.shadow.mapSize.set(1024,1024);
scene.add(new THREE.HemisphereLight(0xd9efff,0x536044,2));const sun=new THREE.DirectionalLight(0xffedce,2.3);sun.position.set(-25,45,20);sun.castShadow=true;scene.add(sun);
const M=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const green=M(0x587d48),sand=M(0xc6b17c),wood=M(0x60432b),leaf=M(0x285d3c),cream=M(0xb8a98a);
const groundTex=canvasTex(1024,1024,(g,w,h)=>{g.fillStyle='#496f38';g.fillRect(0,0,w,h);
for(let i=0;i<4200;i++){const x=Math.random()*w,y=Math.random()*h,r=3+Math.random()*24;g.globalAlpha=.06+Math.random()*.13;g.fillStyle=['#a4b96a','#1f4b2d','#77984b','#d0bd78'][i%4];g.beginPath();g.ellipse(x,y,r,r*.45,Math.random()*3,0,Math.PI*2);g.fill()}
for(let i=0;i<26000;i++){const x=Math.random()*w,y=Math.random()*h;g.globalAlpha=.18+Math.random()*.35;g.strokeStyle=['#b5c978','#254c2b','#789c49','#d0c28a'][i%4];g.lineWidth=.5+Math.random()*1.2;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x-2-Math.random()*4,y-5,x+Math.random()*5-2,y-3-Math.random()*8);g.stroke()}
for(let i=0;i<500;i++){g.globalAlpha=.1;g.fillStyle='#c6b27c';g.beginPath();g.ellipse(Math.random()*w,Math.random()*h,2+Math.random()*5,1+Math.random()*3,0,0,Math.PI*2);g.fill()}g.globalAlpha=1});
groundTex.repeat.set(12,12);const floor=new THREE.Mesh(new THREE.CircleGeometry(115,96),new THREE.MeshStandardMaterial({map:groundTex,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const pathTex=canvasTex(512,512,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle='#b69a69';g.globalAlpha=.9;g.beginPath();g.moveTo(190,0);g.bezierCurveTo(250,130,90,240,210,512);g.lineTo(330,512);g.bezierCurveTo(210,250,390,140,270,0);g.closePath();g.fill();g.globalAlpha=1});
const path=new THREE.Mesh(new THREE.PlaneGeometry(17,155),new THREE.MeshStandardMaterial({map:pathTex,transparent:true,roughness:1,depthWrite:false}));path.rotation.x=-Math.PI/2;path.position.set(2,.035,-3);scene.add(path);
const barkMat=M(0x59402b),leafMats=[M(0x244f2d),M(0x2f6537),M(0x3b7540),M(0x477f43),M(0x315b32)];
const leafGeo=new THREE.SphereGeometry(1,12,10);
function tree(x,z,s=1){const g=new THREE.Group();
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.19*s,.38*s,4.4*s,9),barkMat);trunk.position.y=2.2*s;trunk.rotation.z=(Math.random()-.5)*.08;trunk.castShadow=true;g.add(trunk);
for(let b=0;b<4;b++){const branch=new THREE.Mesh(new THREE.CylinderGeometry(.055*s,.12*s,1.65*s,7),barkMat);const a=b*Math.PI/2;branch.position.set(Math.cos(a)*.38*s,3.05*s,Math.sin(a)*.38*s);branch.rotation.z=Math.cos(a)*-.58;branch.rotation.x=Math.sin(a)*.58;branch.castShadow=true;g.add(branch)}
for(let i=0;i<17;i++){const a=i*2.399,rad=(.35+Math.random()*.9)*s,y=(3.55+Math.random()*1.65)*s;const crown=new THREE.Mesh(leafGeo,leafMats[i%leafMats.length]);crown.position.set(Math.cos(a)*rad,y,Math.sin(a)*rad);const k=(.65+Math.random()*.62)*s;crown.scale.set(k*1.12,k*.78,k);crown.rotation.y=a;crown.castShadow=true;g.add(crown)}
g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(g);return g}
for(let i=0;i<68;i++){const a=Math.random()*Math.PI*2,r=19+Math.random()*70;tree(Math.cos(a)*r,Math.sin(a)*r,.72+Math.random()*.72)}
// Grama em tufos instanciados: muito detalhe visual com poucas chamadas de desenho.
const grassGeo=new THREE.ConeGeometry(.075,.42,4);grassGeo.translate(0,.19,0);
const grassMat=new THREE.MeshStandardMaterial({color:0x83a94c,roughness:1});
const grass=new THREE.InstancedMesh(grassGeo,grassMat,2600);const dummy=new THREE.Object3D();
for(let i=0;i<2600;i++){const a=Math.random()*Math.PI*2,r=5+Math.random()*76;dummy.position.set(Math.cos(a)*r,.025,Math.sin(a)*r);dummy.rotation.set((Math.random()-.5)*.2,Math.random()*Math.PI*2,(Math.random()-.5)*.2);const s=.45+Math.random()*.95;dummy.scale.set(s,s,s);dummy.updateMatrix();grass.setMatrixAt(i,dummy.matrix)}grass.instanceMatrix.needsUpdate=true;scene.add(grass);
// Pedras pequenas e arbustos próximos às casas para quebrar a repetição do terreno.
const rockMat=M(0x77786b),bushMat=M(0x315f32);
for(let i=0;i<95;i++){const a=Math.random()*Math.PI*2,r=9+Math.random()*68;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.18+Math.random()*.42,0),rockMat);rock.position.set(Math.cos(a)*r,.12,Math.sin(a)*r);rock.scale.y=.55;rock.rotation.set(Math.random(),Math.random(),Math.random());scene.add(rock)}
for(let i=0;i<48;i++){const a=Math.random()*Math.PI*2,r=12+Math.random()*65;const bush=new THREE.Group();for(let j=0;j<5;j++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.48,9,8),leafMats[(i+j)%leafMats.length]);leaf.position.set((Math.random()-.5)*.9,.35+Math.random()*.5,(Math.random()-.5)*.9);leaf.scale.set(1,.8,1);bush.add(leaf)}bush.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(bush)}
const wallTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#c9b894';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.globalAlpha=.08;g.fillStyle=i%2?'#695b42':'#fff0c9';g.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*8,1+Math.random()*3)}g.globalAlpha=1});
const roofMat=new THREE.MeshStandardMaterial({color:0x69412f,roughness:.9}),trimMat=M(0x57402c);
function house(x,z,variant=0){const g=new THREE.Group(),w=variant?9:8,d=variant?7:6;const body=new THREE.Mesh(new THREE.BoxGeometry(w,4.2,d),new THREE.MeshStandardMaterial({map:wallTex,roughness:.95}));body.position.y=2.15;body.castShadow=true;body.receiveShadow=true;g.add(body);
const shape=new THREE.Shape();shape.moveTo(-w/2-.65,0);shape.lineTo(0,2.7);shape.lineTo(w/2+.65,0);shape.lineTo(-w/2-.65,0);const roof=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:d/2+.65,bevelEnabled:false}),roofMat);roof.position.set(0,4.15,-d/2-.32);roof.castShadow=true;g.add(roof);
for(const xx of [-2.45,2.45]){const frame=new THREE.Mesh(new THREE.BoxGeometry(1.55,1.35,.12),M(0xe5d2aa));frame.position.set(xx,2.55,d/2+.08);g.add(frame);const win=new THREE.Mesh(new THREE.BoxGeometry(1.35,1.15,.14),M(0x294c54,.25));win.position.set(xx,2.55,d/2+.16);g.add(win);const cross=new THREE.Mesh(new THREE.BoxGeometry(.07,1.18,.04),M(0xe5d2aa));cross.position.set(xx,2.55,d/2+.25);g.add(cross)}
const door=new THREE.Mesh(new THREE.BoxGeometry(1.25,2.45,.14),M(0x65432d));door.position.set(0,1.25,d/2+.1);g.add(door);const knob=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),M(0xd4b16b));knob.position.set(.42,1.25,d/2+.2);g.add(knob);
const porch=new THREE.Mesh(new THREE.BoxGeometry(w*.72,.22,1.6),M(0x8b704d));porch.position.set(0,.25,d/2+.7);g.add(porch);for(const xx of [-w*.32,w*.32]){const post=new THREE.Mesh(new THREE.BoxGeometry(.16,2.7,.16),trimMat);post.position.set(xx,1.55,d/2+1.25);g.add(post)}
const step=new THREE.Mesh(new THREE.BoxGeometry(2.4,.16,.7),M(0x927650));step.position.set(0,.1,d/2+1.6);g.add(step);g.position.set(x,0,z);scene.add(g);return g}
house(24,-28);house(-28,-35,1);house(35,25);
function box(parent,w,h,d,color,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(color));o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
function limb(parent,a,b,r1,r2,color){const v=new THREE.Vector3().subVectors(b,a),o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,v.length(),9),M(color));o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());o.castShadow=true;parent.add(o)}
function capsuleBetween(parent,a,b,r,color){const v=new THREE.Vector3().subVectors(b,a);const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(.05,v.length()-2*r),5,12),M(color));mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());mesh.castShadow=true;parent.add(mesh);return mesh}
function ellipsoid(parent,color,pos,scale,segments=20){const mesh=new THREE.Mesh(new THREE.SphereGeometry(1,segments,16),M(color));mesh.position.set(...pos);mesh.scale.set(...scale);mesh.castShadow=true;parent.add(mesh);return mesh}
function soldier(colors={shirt:0x344c60,pants:0x26313a,skin:0xc58f6b,gear:0x354b32}){
 const g=new THREE.Group(),shirt=colors.shirt,pants=colors.pants,skin=colors.skin,gear=colors.gear;g.userData.anim={arms:[],legs:[]};
 // Corpo com volumes arredondados, proporções humanas e articulações suaves.
 ellipsoid(g,shirt,[0,1.48,0],[.39,.53,.25]);
 ellipsoid(g,gear,[0,1.49,-.035],[.385,.39,.255]); // colete acolchoado
 ellipsoid(g,0x202c30,[0,1.48,-.245],[.075,.34,.025]); // faixa central do colete
 for(const x of [-.25,.25]){
   ellipsoid(g,gear,[x,1.72,-.035],[.16,.17,.22]); // ombreiras
   const arm=capsuleBetween(g,new THREE.Vector3(x,1.72,0),new THREE.Vector3(x*1.22,1.34,-.19),.115,shirt);g.userData.anim.arms.push(arm);
   ellipsoid(g,skin,[x*1.22,1.32,-.2],[.105,.105,.105]);
   const leg=capsuleBetween(g,new THREE.Vector3(x*.9,1.12,0),new THREE.Vector3(x*1.02,.57,.015),.145,pants);g.userData.anim.legs.push(leg);
   ellipsoid(g,0x30302b,[x*1.02,.55,0],[.15,.13,.16]); // joelheira
   ellipsoid(g,0x171d20,[x*1.02,.16,-.09],[.17,.16,.29]); // bota
 }
 ellipsoid(g,skin,[0,2.08,0],[.225,.285,.215],24);
 ellipsoid(g,skin,[-.225,2.08,0],[.055,.09,.07]);ellipsoid(g,skin,[.225,2.08,0],[.055,.09,.07]);
 // Capacete arredondado, com aba e tira.
 ellipsoid(g,0x344936,[0,2.245,0],[.255,.17,.245],24);
 ellipsoid(g,0x26372d,[0,2.19,-.045],[.275,.045,.26],24);
 ellipsoid(g,0x1e2926,[0,2.035,-.19],[.13,.035,.025]);
 // Bolsas, fivelas e tiras do equipamento.
 for(const x of [-.24,.24]){ellipsoid(g,gear,[x,1.42,-.245],[.105,.14,.07]);ellipsoid(g,0x9a8054,[x,1.42,-.31],[.035,.035,.018])}
 capsuleBetween(g,new THREE.Vector3(-.31,1.82,-.08),new THREE.Vector3(-.12,1.2,-.2),.035,0x9a8054);
 capsuleBetween(g,new THREE.Vector3(.31,1.82,-.08),new THREE.Vector3(.12,1.2,-.2),.035,0x9a8054);
 const rifle=new THREE.Group();
 const receiver=new THREE.Mesh(new THREE.BoxGeometry(.16,.17,.62),M(0x202729));receiver.position.z=-.18;rifle.add(receiver);
 const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.035,.04,.52,10),M(0x111719));barrel.rotation.x=Math.PI/2;barrel.position.set(0,.015,-.72);rifle.add(barrel);
 const stock=new THREE.Mesh(new THREE.BoxGeometry(.14,.14,.28),M(0x493b2d));stock.position.z=.25;rifle.add(stock);
 const grip=new THREE.Mesh(new THREE.BoxGeometry(.11,.25,.12),M(0x493b2d));grip.position.set(0,-.18,-.08);rifle.add(grip);
 rifle.position.set(.42,1.28,-.34);rifle.rotation.x=-.08;g.add(rifle);g.userData.rifle=rifle;
 g.traverse(o=>{if(o.isMesh)o.castShadow=true});return g
}
const player=soldier();scene.add(player);player.position.set(0,0,0);
let yaw=0,pitch=-.08,first=false;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='c')toggle()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function toggle(){first=!first;player.visible=!first;document.querySelector('#status').textContent=first?'Primeira pessoa':'Terceira pessoa'}document.querySelector('#camera').onclick=toggle;
const bots=[];for(let i=0;i<4;i++){const bot=soldier({shirt:0x8b4437,pants:0x34383d,skin:0xb98565,gear:0x5c332b});bot.position.set([-8,7,-5,12][i],0,[-19,-27,-36,-24][i]);scene.add(bot);bots.push({mesh:bot,hp:3,alive:true})}
let drag=null;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.28){drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-drag.x)*.005;pitch=Math.max(-.65,Math.min(.45,pitch-(e.clientY-drag.y)*.003));drag={x:e.clientX,y:e.clientY}}});canvas.addEventListener('pointerup',()=>drag=null);
let mx=0,my=0;const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');function stickMove(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.min(38,Math.hypot(x,y)),a=Math.atan2(y,x);mx=Math.cos(a)*d/38;my=Math.sin(a)*d/38;nub.style.transform='translate('+mx*35+'px,'+my*35+'px)'}function reset(){mx=my=0;nub.style.transform=''}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)stickMove(e)});stick.addEventListener('pointerup',reset);stick.addEventListener('pointercancel',reset);
let ammo=30;const bullets=[];function reload(){ammo=30;document.querySelector('#ammo').textContent=ammo;document.querySelector('#status').textContent='Carregador completo'}document.querySelector('#reload').onclick=reload;
function shoot(){if(!ammo){document.querySelector('#status').textContent='Sem munição · recarregue';return}ammo--;document.querySelector('#ammo').textContent=ammo;
const dir=new THREE.Vector3(-Math.sin(yaw),Math.sin(pitch),-Math.cos(yaw)).normalize();const start=player.position.clone().add(new THREE.Vector3(0,1.48,0)).add(dir.clone().multiplyScalar(.9));const mesh=new THREE.Mesh(new THREE.SphereGeometry(.075,8,8),M(0xffd36a));mesh.position.copy(start);scene.add(mesh);bullets.push({mesh,dir,life:2.5})}
document.querySelector('#fire').onclick=shoot;
const clock=new THREE.Clock();let walkPhase=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let v=forward.multiplyScalar((keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)-my).add(right.multiplyScalar((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+mx));if(v.length()>1)v.normalize();player.position.addScaledVector(v,dt*6);const moving=v.lengthSq()>.015;if(moving)player.rotation.y=Math.atan2(-v.x,-v.z);
if(moving){walkPhase+=dt*10}else{walkPhase*=Math.max(0,1-dt*7)}
const swing=Math.sin(walkPhase)*.48,legs=player.userData.anim.legs,arms=player.userData.anim.arms;
if(legs.length===2){legs[0].rotation.x=swing;legs[1].rotation.x=-swing}
if(arms.length===2){arms[0].rotation.x=-swing*.42;arms[1].rotation.x=swing*.42}
player.position.y=moving?Math.abs(Math.sin(walkPhase*2))*.045:0;
if(player.userData.rifle)player.userData.rifle.rotation.x=-.08+Math.sin(walkPhase)*.025;
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.mesh.position.addScaledVector(b.dir,dt*42);b.life-=dt;let hit=false;for(const bot of bots){if(bot.alive){const center=bot.mesh.position.clone().add(new THREE.Vector3(0,1.2,0));if(b.mesh.position.distanceTo(center)<.85){bot.hp--;hit=true;if(bot.hp<=0){bot.alive=false;bot.mesh.visible=false;document.querySelector('#botsLeft').textContent=bots.filter(x=>x.alive).length;document.querySelector('#status').textContent='Robô eliminado!'}else document.querySelector('#status').textContent='Acertou! Mais '+bot.hp+' acertos';break}}}if(hit||b.life<=0){scene.remove(b.mesh);bullets.splice(i,1)}}
let target=player.position.clone().add(new THREE.Vector3(0,first?1.65:2.0,0));if(first){camera.position.copy(target)}else{camera.position.copy(target).add(new THREE.Vector3(Math.sin(yaw)*6,2.25,Math.cos(yaw)*6))}camera.lookAt(target.clone().add(new THREE.Vector3(-Math.sin(yaw)*18,Math.sin(pitch)*18,-Math.cos(yaw)*18)));renderer.render(scene,camera)}
animate();document.querySelector('#status').textContent='4 robôs de treino disponíveis';addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
