const pbrLoader=new THREE.TextureLoader();pbrLoader.setCrossOrigin('anonymous');

function loadPBRMap(url,repeatX,repeatY,isColor,done){

  if(isColor)tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(repeatX,repeatY);
  tex.anisotropy=pbrAniso;done(tex);

}
function applyPBRSet(asset,repeatX,repeatY,match){
 const root='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/'+asset+'/'+asset+'_';
 loadPBRMap(root+'diff_2k.jpg',repeatX,repeatY,true,tex=>{
  scene.traverse(obj=>{if(!obj.isMesh)return;const mats=Array.isArray(obj.material)?obj.material:[obj.material];
   for(const mat of mats)if(match(mat)){mat.map=tex;mat.color.set(0xffffff);mat.needsUpdate=true;}
  });
 });
 loadPBRMap(root+'nor_gl_2k.jpg',repeatX,repeatY,false,tex=>{
  scene.traverse(obj=>{if(!obj.isMesh)return;const mats=Array.isArray(obj.material)?obj.material:[obj.material];
   for(const mat of mats)if(match(mat)){mat.normalMap=tex;mat.normalScale.set(.72,.72);mat.needsUpdate=true;}
  });
 });

   for(const mat of mats)if(match(mat)){mat.roughnessMap=tex;mat.roughness=1;mat.needsUpdate=true;}
  });
 });
}

let mx=0,my=0;const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');function stickMove(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.min(38,Math.hypot(x,y)),a=Math.atan2(y,x);mx=Math.cos(a)*d/38;my=Math.sin(a)*d/38;nub.style.transform='translate('+mx*35+'px,'+my*35+'px)'}function reset(){mx=my=0;nub.style.transform=''}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)stickMove(e)});stick.addEventListener('pointerup',reset);stick.addEventListener('pointercancel',reset);
let ammo=30,life=100,kills=0,playerHitCooldown=0,shotCooldown=0;const bullets=[],enemyBullets=[];function updateHUD(){document.querySelector("#life").textContent=life;document.querySelector("#life").classList.toggle("low",life<35);document.querySelector("#ammo").textContent=ammo;document.querySelector("#kills").textContent=kills;document.querySelector("#botsLeft").textContent=bots.filter(b=>b.alive).length}function reload(){if(ammo===30)return;ammo=30;updateHUD();document.querySelector("#status").textContent="Carregador completo"}document.querySelector("#reload").onclick=reload;

const clock=new THREE.Clock();let walkPhase=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);shotCooldown=Math.max(0,shotCooldown-dt);playerHitCooldown=Math.max(0,playerHitCooldown-dt);const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let v=forward.multiplyScalar((keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)-my).add(right.multiplyScalar((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+mx));if(v.length()>1)v.normalize();player.position.addScaledVector(v,dt*6);const edge=Math.hypot(player.position.x,player.position.z);if(edge>108){player.position.x*=108/edge;player.position.z*=108/edge}const moving=v.lengthSq()>.015;if(moving)player.rotation.y=Math.atan2(-v.x,-v.z);
