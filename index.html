<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Royale Mobile — Protótipo 0.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bb6ad;font-family:system-ui;color:white}#game{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}#top{position:absolute;top:12px;left:12px;background:#071b22a8;padding:9px 12px;border:1px solid #ffffff55;border-radius:10px;font-size:13px}#help{position:absolute;top:12px;right:12px;background:#071b22a8;padding:8px 10px;border-radius:10px;font-size:12px;text-align:right}button{pointer-events:auto;border:1px solid #ffffff99;background:#102c35cc;color:white;border-radius:12px;padding:12px 15px;font-weight:700;font-size:13px;backdrop-filter:blur(8px)}#camera{position:absolute;right:14px;bottom:100px}#fire{position:absolute;right:20px;bottom:24px;width:76px;height:76px;border-radius:50%;background:#a83d32dd}#stick{pointer-events:auto;position:absolute;left:24px;bottom:28px;width:116px;height:116px;border:2px solid #ffffff88;border-radius:50%;background:#0b263655;touch-action:none}#nub{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:#ffffffaa}#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;font-weight:300;color:#fff;opacity:.9}#stats{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#071b22bb;border:1px solid #ffffff55;border-radius:10px;padding:7px 12px;font-size:12px;white-space:nowrap}#health{display:inline-block;width:90px;height:7px;background:#542d2d;border-radius:8px;overflow:hidden;vertical-align:middle;margin-left:5px}#health span{display:block;width:100%;height:100%;background:#65cf79}#note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#071b22bb;padding:10px 14px;border-radius:10px;font-size:12px;white-space:nowrap}
</style>
</head>
<body><canvas id="game"></canvas><div id="hud">
<div id="top"><b>BR MOBILE · v0.3</b><br>Protótipo offline · Ilha de teste<br><span id="status">Carregando cenário…</span></div>
<div id="help">WASD / setas: mover<br>Arraste: olhar · C: câmera</div>
<div id="stick"><div id="nub"></div></div><button id="camera">1ª / 3ª pessoa</button><button id="fire">DISPARAR</button>
<div id="stats">VIDA <span id="health"><span></span></span>　MUNIÇÃO <b id="ammo">30</b>/30</div><div id="crosshair">+</div><div id="note">Explore a ilha · protótipo inicial</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc7d0);scene.fog=new THREE.Fog(0x9bc7d0,45,150);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
scene.add(new THREE.HemisphereLight(0xd9efff,0x536044,2));const sun=new THREE.DirectionalLight(0xffedce,2.4);sun.position.set(-25,45,20);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const sand=mat(0xc6b17c),grass=mat(0x567d45),bark=mat(0x60432b),leaf=mat(0x285d3c),wall=mat(0xb8a98a),roof=mat(0x654c3b);
const ground=new THREE.Mesh(new THREE.CircleGeometry(115,64),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const beach=new THREE.Mesh(new THREE.RingGeometry(83,91,64),sand);beach.rotation.x=-Math.PI/2;beach.position.y=.025;scene.add(beach);
const water=new THREE.Mesh(new THREE.CircleGeometry(140,64),mat(0x347f91,.35));water.rotation.x=-Math.PI/2;water.position.y=-.25;scene.add(water);
function tree(x,z,s=1){let g=new THREE.Group();let t=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.38*s,3.1*s,7),bark);t.position.y=1.55*s;t.castShadow=true;g.add(t);for(let i=0;i<6;i++){let a=i*Math.PI/3;let f=new THREE.Mesh(new THREE.ConeGeometry(.7*s,3.3*s,7),leaf);f.position.set(Math.cos(a)*.7*s,3.4*s,Math.sin(a)*.7*s);f.rotation.z=-Math.cos(a)*.65;f.rotation.x=Math.sin(a)*.65;f.castShadow=true;g.add(f)}g.position.set(x,0,z);scene.add(g)}
for(let i=0;i<65;i++){let a=Math.random()*Math.PI*2,r=18+Math.random()*67;tree(Math.cos(a)*r,Math.sin(a)*r,.65+Math.random()*.7)}
function house(x,z){let g=new THREE.Group(),base=new THREE.Mesh(new THREE.BoxGeometry(8,4.2,6),wall);base.position.y=2.1;base.castShadow=true;base.receiveShadow=true;g.add(base);let r=new THREE.Mesh(new THREE.ConeGeometry(5.8,2.4,4),roof);r.position.y=5.3;r.rotation.y=Math.PI/4;r.castShadow=true;g.add(r);g.position.set(x,0,z);scene.add(g)}
house(13,-12);house(-22,-28);house(32,18);
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.15,4,8),mat(0x344c60));body.position.y=1.35;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),mat(0xd1a17e));head.position.y=2.35;player.add(head);const pack=new THREE.Mesh(new THREE.BoxGeometry(.7,.9,.35),mat(0x354b32));pack.position.set(0,1.45,.52);player.add(pack);
// Arma provisória feita com peças 3D, presa à mão direita do personagem.
const weapon=new THREE.Group();
const gunBody=new THREE.Mesh(new THREE.BoxGeometry(.22,.2,.95),mat(0x252b2c));
gunBody.position.set(0,0,-.28);weapon.add(gunBody);
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.045,.055,.72,10),mat(0x171c1d));
barrel.rotation.x=Math.PI/2;barrel.position.set(0,.015,-.98);weapon.add(barrel);
const grip=new THREE.Mesh(new THREE.BoxGeometry(.16,.38,.2),mat(0x493a2d));
grip.position.set(0,-.25,-.08);grip.rotation.x=-.18;weapon.add(grip);
const sight=new THREE.Mesh(new THREE.BoxGeometry(.1,.09,.18),mat(0x111516));
sight.position.set(0,.14,-.35);weapon.add(sight);
weapon.position.set(.53,1.55,-.28);weapon.rotation.x=-.08;player.add(weapon);
scene.add(player);player.position.set(0,0,0);
let yaw=0,pitch=-.12,first=false;const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='c')toggle()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function toggle(){first=!first;document.querySelector('#status').textContent=first?'Câmera em primeira pessoa':'Câmera em terceira pessoa';body.visible=!first;head.visible=!first;pack.visible=!first;weapon.visible=!first}
document.querySelector('#camera').onclick=toggle;
let drag=null;canvas.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.28){drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(drag){yaw-=(e.clientX-drag.x)*.005;pitch=Math.max(-.8,Math.min(.55,pitch-(e.clientY-drag.y)*.003));drag={x:e.clientX,y:e.clientY}}});canvas.addEventListener('pointerup',()=>drag=null);
let moveX=0,moveY=0;const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)stickMove(e)});function stickMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.min(38,Math.hypot(x,y)),a=Math.atan2(y,x);moveX=Math.cos(a)*d/38;moveY=Math.sin(a)*d/38;nub.style.transform=`translate(${moveX*35}px,${moveY*35}px)`}function resetStick(){moveX=moveY=0;nub.style.transform=''}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
const bullets=[];let ammo=30;function shoot(){if(ammo<=0){document.querySelector('#status').textContent='Sem munição · recarregando';ammo=30;document.querySelector('#ammo').textContent=ammo;return}ammo--;document.querySelector('#ammo').textContent=ammo;const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const b=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),mat(0xffd36a));b.position.copy(player.position).add(new THREE.Vector3(0,1.6,0)).add(dir.clone().multiplyScalar(1.1));b.userData.v=dir.multiplyScalar(32);scene.add(b);bullets.push(b)}document.querySelector('#fire').onclick=shoot;
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);let f=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)-moveY,side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+moveX;let forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let v=forward.multiplyScalar(f).add(right.multiplyScalar(side));if(v.length()>1)v.normalize();player.position.addScaledVector(v,dt*7);if(v.lengthSq()>.01)player.rotation.y=Math.atan2(-v.x,-v.z);
let target;if(first){target=player.position.clone().add(new THREE.Vector3(0,2.15,0));camera.position.copy(target)}else{target=player.position.clone().add(new THREE.Vector3(0,2.2,0));camera.position.copy(target).add(new THREE.Vector3(Math.sin(yaw)*8,2.8,Math.cos(yaw)*8))}let look=target.clone().add(new THREE.Vector3(-Math.sin(yaw)*20,Math.sin(pitch)*20,-Math.cos(yaw)*20));camera.lookAt(look);
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.position.addScaledVector(b.userData.v,dt);if(b.position.length()>120){scene.remove(b);bullets.splice(i,1)}}renderer.render(scene,camera)}
animate();document.querySelector('#status').textContent='Cenário carregado · joystick e arraste para olhar';addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
